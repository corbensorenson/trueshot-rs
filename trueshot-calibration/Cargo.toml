[package]
name = "trueshot-calibration"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.25"
nalgebra = "0.32"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
opencv = { version = "0.88", optional = true, default-features = false, features = ["calib3d", "imgcodecs", "imgproc"] }

[features]
opencv = ["dep:opencv"]
[lints]
workspace = true
