[package]
name = "trueshot-server"
version = "6.8.0"
edition = "2021"

[dependencies]
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-cors = "0.7.0"
actix-files = "0.6.6"
actix-ws = "0.3.0"
actix-web-prom = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.22"
trueshot-core = { path = "../trueshot-core", features = ["wgpu", "vision", "gpu"] }
trueshot-device-manager = { path = "../trueshot-device-manager", features = ["real_cam"] }
config = "0.15.6"
anyhow = "1.0"
gltf = "1.4"
nalgebra = "0.32"
awc = "3.1"
tracing-appender = "0.2"
actix-rt = "2.9"
futures = "0.3"
async-stream = "0.3"
notify-rust = "4.11.7"
sysinfo = "0.37.2"
webrtc = "0.14.0"
tantivy = "0.25.0"
image = "0.25"
mime_guess = "2.0"
ndarray = "0.15"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls"] }
actix-multipart = "0.7.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
urlencoding = "2.1"
base64 = "0.22"
jsonwebtoken = "9.3"
keyring = "2.3"
rand = "0.8"
argon2 = "0.5"
walkdir = "2.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
aes-gcm = "0.10"
dirs = "5.0"
infer = "0.16"
sha2 = "0.10"
hex = "0.4"
rustls = "0.23"
rustls-pemfile = "2"
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
utoipa = { version = "4.2.3", features = ["chrono", "uuid"] }
tar = "0.4"
flate2 = "1.0"
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
[lints]
workspace = true

[dev-dependencies]
tempfile = "3.10"
