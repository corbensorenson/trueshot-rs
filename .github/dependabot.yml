version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      rust-compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /trueshot-dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dashboard-compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      action-updates:
        patterns:
          - "*"
