name: TrueShot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y libudev-dev libssl-dev pkg-config libasound2-dev cmake
          - os: macos-latest
            install_deps: |
              brew install cmake openssl pkg-config
          - os: windows-latest
            install_deps: echo "No extra deps needed on Windows"

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Install System Dependencies
      run: ${{ matrix.install_deps }}
      shell: bash

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: trueshot-dashboard/package-lock.json

    - name: Build Dashboard
      run: |
        cd trueshot-dashboard
        npm ci --legacy-peer-deps
        npm run build
        cd ..

    - name: Lint Dashboard
      run: |
        cd trueshot-dashboard
        npm run lint
        cd ..

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Clippy (Linting)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Check All Rust Targets
      run: ./scripts/check_rust_future_incompat.sh

    - name: Build Backend
      run: cargo build --verbose --workspace

    - name: Run Tests
      run: cargo test --verbose --workspace

    - name: Generate OpenAPI spec
      run: cargo run -p trueshot-server -- --openapi-out docs/openapi.json

    - name: Verify OpenAPI spec
      run: git diff --exit-code docs/openapi.json

    - name: Check Feature Matrix Parity
      run: ./scripts/check_feature_matrix.sh

    - name: Check Local-First Boundary Classification
      run: python ./scripts/check_local_first_boundary.py

  redis-integration:
    name: Redis Integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TRUESHOT_REDIS_TEST_URL: redis://127.0.0.1:6379/
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev libssl-dev pkg-config libasound2-dev cmake

    - name: Test Redis cache, reconnect, relay, and offline behavior
      run: |
        cargo test -p trueshot-redis-cache
        cargo test -p trueshot-server redis_runtime::tests
        cargo test -p trueshot-server distributed_bus::tests

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Run Security Audit
      run: cargo audit

  supply-chain:
    name: Supply Chain Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: trueshot-dashboard/package-lock.json

    - name: Install cargo-deny and cargo-cyclonedx
      run: |
        cargo install cargo-deny --version 0.19.0 --locked
        cargo install cargo-cyclonedx

    - name: Run cargo-deny
      run: cargo deny check bans licenses sources advisories

    - name: Generate Rust SBOM (CycloneDX)
      run: cargo cyclonedx -f json -o sbom-rust.json

    - name: Install dashboard dependencies
      run: |
        cd trueshot-dashboard
        npm ci --legacy-peer-deps

    - name: Run npm audit
      run: |
        cd trueshot-dashboard
        npm audit --audit-level=high

    - name: Generate dashboard SBOM (CycloneDX)
      run: |
        cd trueshot-dashboard
        npm sbom --sbom-format=cyclonedx --omit=dev > ../sbom-dashboard.json

    - name: Upload SBOMs
      uses: actions/upload-artifact@v4
      with:
        name: sboms
        path: |
          sbom-rust.json
          sbom-dashboard.json

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t trueshot-scan .

    - name: Scan image with Trivy (SARIF)
      uses: aquasecurity/trivy-action@0.17.0
      with:
        image-ref: trueshot-scan
        format: sarif
        output: trivy-results.sarif
        ignore-unfixed: true
        vuln-type: os,library

    - name: Upload Trivy report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-results
        path: trivy-results.sarif

  slsa-attest:
    name: SLSA Attestation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build release artifacts
      run: cargo build --release -p trueshot-server

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: target/release/trueshot-server

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t trueshot-smoke .

    - name: Run container
      run: |
        docker run -d --name trueshot-smoke -p 3000:3000 trueshot-smoke

    - name: Wait for health
      run: |
        for i in {1..30}; do
          if curl -fsS http://localhost:3000/api/health > /dev/null; then
            echo "Health check passed"
            exit 0
          fi
          sleep 2
        done
        echo "Health check failed"
        docker logs trueshot-smoke
        exit 1

    - name: Cleanup
      if: always()
      run: |
        docker rm -f trueshot-smoke || true

  benchmarks:
    name: Benchmark Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev libssl-dev pkg-config libasound2-dev cmake
    
    - name: Check Benchmark Targets
      run: cargo check -p trueshot-benches --all-targets

    - name: Smoke Test Benchmark Paths
      run: cargo bench -p trueshot-benches -- --test

    - name: Validate Quality Gate
      run: |
        node scripts/benchmarks/ci_gate.js \
          benchmarks/results/realtest_20260208T082507Z.json \
          benchmarks/results/realtest_20260208T082507Z.json
