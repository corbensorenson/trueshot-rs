[package]
name = "trueshot-core"
version = "0.6.2"
edition = "2021"

[dependencies]
trueshot-vision = { path = "../trueshot-vision", optional = true }
trueshot-sfm = { path = "../trueshot-sfm" }
trueshot-calibration = { path = "../trueshot-calibration" }
trueshot-ai = { path = "../trueshot-ai" }
trueshot-storage = { path = "../trueshot-storage" }
trueshot-device-manager = { path = "../trueshot-device-manager" }
image = "0.25"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28", features = ["full", "tracing"] }
wgpu = { version = "0.19", optional = true }
crossbeam-channel = "0.5"
bytemuck = { version = "1.16", features = ["derive"] }
anyhow = "1.0"
config = "0.13" 
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
opentelemetry = "0.21"
opentelemetry_sdk = "0.21"
opentelemetry-otlp = "0.14"
tracing-opentelemetry = "0.22"
serde_yaml = "0.9.34"
ndarray = { version = "0.15", features = ["rayon"] }
rustfft = "6.2"
rayon = "1.7"
rust-s3 = "0.33"
wasmtime = "14.0"
exif = { package = "kamadak-exif", version = "0.5" }
tiff = "0.9"
half = "2.3"
uuid = { version = "1.4", features = ["v4", "serde"] }
csv = "1.3"
color_quant = "1.1"
imageproc = "0.23"
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1.5"
num-traits = "0.2"
rand = "0.8"
kdtree = "0.7"
hex = "0.4"
tracing-appender = "0.2"
sysinfo = "0.30"
redb = "1.4"
intel_tex_2 = "0.4"
async-trait = "0.1"
dashmap = "5.5"
lazy_static = "1.4"
sentry = "0.31"
tracing-log = "0.2"
walkdir = "2.4"
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
hostname = "0.3"
num_cpus = "1.16"
human-panic = "1.2"
mdns-sd = "0.10"
futures = "0.3"
pollster = "0.3"
ort = "2.0.0-rc.9"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", features = ["pem"] }
mac_address = "1.1"
dirs = "5.0"
base64 = "0.21"
utoipa = { version = "4.2", optional = true, features = ["chrono", "uuid"] }
aes-gcm = "0.10"
keyring = "2.3"
zeroize = "1.7"
zstd = "0.13"
lz4_flex = "0.11"
zip = "0.6"
# Use redb instead of rusqlite to avoid SQLite version conflicts
# redb is already a dependency and provides similar functionality
[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.4"


[features]
default = ["wgpu"]
wgpu = ["dep:wgpu"]
vision = ["dep:trueshot-vision"]
timing = ["comfy-table"]
gpu = []
opencv = ["trueshot-calibration/opencv"]
utoipa = ["dep:utoipa"]
dev_license = []

[dependencies.comfy-table]
version = "7.0"
optional = true

[dev-dependencies]
tempfile = "3.10"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[lints.rust]
non_snake_case = "allow"
