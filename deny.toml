[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" }
]
all-features = true

[bans]
multiple-versions = "deny"
highlight = "all"
skip = [
  { name = "rand", version = "0.4" },
  { name = "bitflags", version = "1.3" }
]
skip-tree = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-DFS-2016"
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
ignore = []
