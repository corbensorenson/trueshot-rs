[workspace]
name = "pga"
authors = ["Jeffrey Sorenson <clinoid@gmail.com>", "Corben Sorenson <corbensorenson@yahoo.com"]
channels = ["conda-forge"]
platforms = ["osx-arm64"]
version = "0.1.74"


[tasks]
start="python"

[dependencies]
future = ">=1.0.0,<2"
pydantic = ">=2.11.4,<3"
pathlib = ">=1.0.1,<2"
wheel = "*"
setuptools = "*"
python = ">=3.13.3,<3.14"
psycopg2-binary = ">=2.9,<3"

[pypi-dependencies]
gphoto2 = ">=2.5.1, <3"
importlib = ">=1.0.4, <2"
asyncio = ">=3.4.3, <4"
datetime = ">=5.5, <6"
blinker = ">=1.9.0, <2"
sqlmodel = ">=0.0.24, <0.0.25"
sqlalchemy = ">=2.0.41,<3"
bleak = ">=0.22.3, <0.23"

