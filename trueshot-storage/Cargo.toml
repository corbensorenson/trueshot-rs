[package]
name = "trueshot-storage"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
image = "0.25"
anyhow = "1.0"
sysinfo = "0.29"
tokio = { version = "1.28", features = ["fs", "io-util", "rt"] }
nalgebra = "0.32" # for octree point types
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1.7"
hkdf = "0.12"
sha2 = "0.10"

[features]
default = []
linux = ["dep:tokio-uring"]

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
