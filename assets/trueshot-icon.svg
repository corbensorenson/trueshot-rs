<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the camera body -->
    <linearGradient id="cameraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the lens -->
    <radialGradient id="lensGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2980b9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f4e79;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gradient for the focus ring -->
    <linearGradient id="focusGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0392b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="8"/>
  
  <!-- Camera body -->
  <rect x="120" y="180" width="272" height="200" rx="20" ry="20" fill="url(#cameraGradient)" stroke="#1a252f" stroke-width="3"/>
  
  <!-- Camera top -->
  <rect x="160" y="140" width="192" height="50" rx="10" ry="10" fill="url(#cameraGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Viewfinder -->
  <rect x="220" y="150" width="72" height="20" rx="5" ry="5" fill="#1a252f"/>
  
  <!-- Main lens outer ring -->
  <circle cx="256" cy="280" r="80" fill="url(#lensGradient)" stroke="#1f4e79" stroke-width="4"/>
  
  <!-- Lens inner ring -->
  <circle cx="256" cy="280" r="65" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Lens glass -->
  <circle cx="256" cy="280" r="50" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Lens reflection -->
  <ellipse cx="240" cy="265" rx="25" ry="30" fill="#5dade2" opacity="0.3"/>
  <ellipse cx="235" cy="260" rx="12" ry="15" fill="#85c1e9" opacity="0.5"/>
  
  <!-- Focus ring indicators -->
  <g stroke="url(#focusGradient)" stroke-width="3" fill="none">
    <path d="M 196 280 A 60 60 0 0 1 206 225"/>
    <path d="M 316 280 A 60 60 0 0 0 306 225"/>
    <path d="M 256 220 A 60 60 0 0 1 311 270"/>
    <path d="M 256 340 A 60 60 0 0 1 201 290"/>
  </g>
  
  <!-- Camera brand text area -->
  <rect x="140" y="320" width="80" height="20" rx="3" ry="3" fill="#1a252f"/>
  
  <!-- Flash -->
  <circle cx="180" cy="160" r="8" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  
  <!-- Mode dial -->
  <circle cx="320" cy="160" r="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
  <circle cx="320" cy="160" r="8" fill="#34495e"/>
  <line x1="320" y1="152" x2="320" y2="160" stroke="#e74c3c" stroke-width="2"/>
  
  <!-- TrueShot text -->
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#2c3e50">TrueShot</text>
  
  <!-- Subtitle -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">RAW Processing</text>
</svg>
