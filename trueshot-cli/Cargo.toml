[package]
name = "trueshot-cli"
version = "0.5.4"
edition = "2021"
description = "Command-line interface for TrueShot RAW processing pipeline"
license = "MIT"
authors = ["TrueShot Team"]

[[bin]]
name = "trueshot"
path = "src/main.rs"

[[bin]]
name = "daemon"
path = "src/bin/daemon.rs"

[dependencies]
trueshot-core = { path = "../trueshot-core", features = ["gpu"] }
trueshot-device-manager = { path = "../trueshot-device-manager" }
clap = { version = "4.4", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
indicatif = "0.17"
console = "0.15"
colored = "2.1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = "1.0"
tray-icon = "0.21.2"
winit = "0.30.12"
tao = "0.34.5"
sysinfo = "0.30"
num_cpus = "1.16"
nalgebra = "0.32"
image = "0.25"
config = "0.13"
toml = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
bincode = "1.3"
zstd = "0.13"
libc = "0.2"

[features]
opencv = ["trueshot-core/opencv"]
dev_license = ["trueshot-core/dev_license"]

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
