[workspace]
resolver = "2"
members = [
    "trueshot-core",
    "trueshot-server",
    "trueshot-cli",
    "trueshot-vision",
    "trueshot-calibration",
    "trueshot-ai",
    "trueshot-storage",
    "trueshot-proto",

    "trueshot-benches",

    "trueshot-redis-cache",
    "trueshot-launcher",
    "trueshot-device-manager",
    "trueshot-sfm",
]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = "1.28"
serde = "1.0"
image = "0.24"
nalgebra = "0.32"
pyo3 = "0.22"
serde_json = "1.0"
redis = "0.32.7"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
redundant_closure = "allow"
ptr_arg = "allow"
clone_on_copy = "allow"
single_match = "allow"
match_single_binding = "allow"
manual_range_patterns = "allow"
needless_range_loop = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
len_without_is_empty = "allow"
unnecessary_cast = "allow"

[workspace.lints.rust]
non_snake_case = "allow"
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
