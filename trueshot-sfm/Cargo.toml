[package]
name = "trueshot-sfm"
version = "0.1.0"
edition = "2021"
description = "Native Rust Structure from Motion - standalone 3D reconstruction without external dependencies"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

# Math & Linear Algebra
nalgebra = { version = "0.32", features = ["serde-serialize"] }
ndarray = { version = "0.15", features = ["rayon"] }

# Image processing
image = "0.25"
imageproc = "0.23"

# Parallel processing
rayon = "1.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.4", features = ["v4"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3.10"
[lints]
workspace = true
